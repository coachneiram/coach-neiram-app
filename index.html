*{box-sizing:border-box;}
body{margin:0;}
.app-shell{display:flex; min-height:100vh;}
.sidebar{width:224px; flex-shrink:0; background:${COLORS.surface}; border-right:1px solid ${COLORS.border}; padding:20px 14px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;}

.nav-list{display:flex; flex-direction:column; gap:2px; flex:1;}
.nav-item{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; border:none; background:transparent; color:${COLORS.textMuted}; font-size:13.5px; font-weight:500; cursor:pointer; text-align:left; font-family:'Inter',sans-serif;}
.nav-item.active{background:${COLORS.bgAlt}; color:${COLORS.gold}; font-weight:600;}
.profile-link{display:flex; align-items:center; gap:8px; padding-top:16px; margin-top:8px; border:none; border-top:1px solid ${COLORS.border}; background:transparent; color:${COLORS.textFaint}; font-size:12px; cursor:pointer; font-family:'Inter',sans-serif;}
.main-content{flex:1; min-width:0; padding:24px; max-width:820px;}
.modal-overlay{position:fixed; inset:0; background:rgba(4,6,10,0.66); display:flex; align-items:flex-end; justify-content:center; z-index:50; backdrop-filter:blur(2px);}
.modal-panel{background:${COLORS.surface}; border:1px solid ${COLORS.border}; border-radius:20px 20px 0 0; width:100%; max-height:88vh; overflow-y:auto; padding:22px; animation:slideUp .22s ease-out;}
@keyframes slideUp{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.spin{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
input[type=date],input[type=time]{color-scheme:dark;}
input::placeholder,textarea::placeholder{color:${COLORS.textFaint};}
button,input,select,textarea{font-family:inherit;}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid ${COLORS.gold}; outline-offset:2px;}
.toast{position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:90; display:flex; align-items:center; gap:10px; background:${COLORS.surface}; border:1px solid ${COLORS.borderLight}; border-radius:12px; padding:11px 14px; max-width:min(560px, calc(100vw - 24px)); box-shadow:0 8px 28px rgba(0,0,0,0.55); font-size:12.5px; color:${COLORS.text}; animation:slideDown .25s ease-out;}
@keyframes slideDown{from{transform:translate(-50%,-10px); opacity:0;} to{transform:translate(-50%,0); opacity:1;}}
.mobile-header{display:none;}
.bottom-nav{display:none;}
@media (max-width:760px){
  .sidebar{display:none;}
  .mobile-header{display:flex; position:sticky; top:0; z-index:30; align-items:center; justify-content:space-between; padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top)); background:rgba(11,11,12,0.94); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid ${COLORS.border};}
  .bottom-nav{display:flex; position:fixed; left:0; right:0; bottom:0; z-index:30; background:${COLORS.surface}; border-top:1px solid ${COLORS.border}; padding:6px 4px calc(8px + env(safe-area-inset-bottom));}
  .bottom-nav button{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:${COLORS.textFaint}; font-size:8.8px; font-weight:600; padding:7px 1px; cursor:pointer; font-family:'Inter',sans-serif; border-radius:8px;}
  .bottom-nav button.active{color:${COLORS.gold};}
  .main-content{padding:16px 14px calc(92px + env(safe-area-inset-bottom)); max-width:100%;}
  .modal-panel{max-height:92vh;}
  input,select,textarea{font-size:16px !important;}
  .toast{top:calc(66px + env(safe-area-inset-top));}
}
@media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}}
