<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0C" />

    <!--
      Memes ressources PWA que index.html, et aux memes noms : c'est ce qui
      permet a un client qui a deja l'application sur son ecran d'accueil de
      la retrouver a l'identique apres la bascule, sans reinstaller.
    -->
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <title>Coach Neiram</title>

    <!--
      Memes polices que index.html, et exactement les memes graisses.
      Sans elles, toute l'application retombe sur la police du systeme :
      les ecrans restent fonctionnels mais ne ressemblent plus a rien de
      ce que le client connait.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Mode hors ligne. Volontairement defensif : toute erreur est absorbee,
      pour qu'un service worker indisponible ou refuse ne puisse jamais
      empecher l'application de se lancer.

      Sans cet enregistrement, la bascule ferait disparaitre le mode hors
      ligne ET l'installation sur l'ecran d'accueil, sans aucun message.
    -->
    <script>
      (function () {
        if (!("serviceWorker" in navigator)) return;
        window.addEventListener("load", function () {
          try {
            navigator.serviceWorker.register("sw.js").catch(function () {});
          } catch (e) {}
        });
      })();
    </script>

    <!--
      Catalogues d'aliments, dans le MEME ORDRE que index.html : le dernier
      charge (food-basic-catalog.js) installe le moteur de recherche commun
      et l'interception de fetch vers Open Food Facts. Inverser l'ordre
      priverait l'application de la moitie de ses aliments.

      Ce sont des scripts classiques, et non des modules : ils doivent avoir
      pose window.__CN_FOOD_SEARCH__ AVANT que le module de l'application ne
      s'execute. Un <script type="module"> est differe, un script classique
      ne l'est pas — c'est ce qui garantit l'ordre.

      Les fichiers sont des liens vers ceux de la racine du depot, pour
      qu'une correction du catalogue profite aux deux versions.
      tests/catalogues-publies.test.mjs verifie qu'ils ne divergent pas.
    -->
    <script src="./food-extended-catalog.js"></script>
    <script src="./food-staples-catalog.js"></script>
    <script src="./food-bruts-catalog.js"></script>
    <script src="./food-basic-catalog.js"></script>
    <script src="./food-fibres.js"></script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
