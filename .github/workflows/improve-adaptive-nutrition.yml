name: Improve adaptive nutrition

on:
  push:
    branches: [main]
    paths:
      - 'scripts/improve-adaptive-nutrition.py'
      - '.github/workflows/improve-adaptive-nutrition.yml'

permissions:
  contents: write

jobs:
  patch-nutrition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply adaptive nutrition engine
        run: python scripts/improve-adaptive-nutrition.py
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert 'function computeTargets(profile, currentWeightKg)' in s
          assert 'adaptiveMaintenanceKcal' in s
          assert 'function computeCalibration' in s
          assert s.count('<script>') == s.count('</script>')
          print('Adaptive nutrition checks passed')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/improve-adaptive-nutrition.py .github/workflows/improve-adaptive-nutrition.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add adaptive calorie and macro targets"
          git push
