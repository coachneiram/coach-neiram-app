name: Fix Journal date navigation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_journal_date_navigation.py'

permissions:
  contents: write

jobs:
  fix-journal-date:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch date arithmetic
        run: python scripts/fix_journal_date_navigation.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/fix_journal_date_navigation.py .github/workflows/fix-journal-date.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix Journal day navigation timezone bug"
          git push
