name: Restore exercise library

on:
  push:
    branches: [main]
    paths:
      - 'scripts/restore_exercise_library.py'
      - 'scripts/fix_journal_date_navigation.py'
      - 'index.html'
      - '.github/workflows/restore-exercise-library.yml'

permissions:
  contents: write

jobs:
  restore-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore exercise library
        run: python scripts/restore_exercise_library.py

      - name: Fix Journal local date arithmetic
        run: python scripts/fix_journal_date_navigation.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/restore_exercise_library.py scripts/fix_journal_date_navigation.py .github/workflows/restore-exercise-library.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Restore exercise library and fix Journal dates"
          git push
