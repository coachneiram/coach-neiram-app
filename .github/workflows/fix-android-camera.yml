name: Fix Android camera inputs

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_android_camera.py'

permissions:
  contents: write

jobs:
  patch-camera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Android camera patch
        run: python scripts/fix_android_camera.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/fix_android_camera.py .github/workflows/fix-android-camera.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Android camera access"
          git push
