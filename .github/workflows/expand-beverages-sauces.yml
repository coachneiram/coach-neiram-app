name: Expand beverages and sauces

on:
  push:
    branches: [main]
    paths:
      - 'scripts/expand-beverages-sauces.py'

permissions:
  contents: write

jobs:
  patch-food-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply beverage and sauce improvements
        run: python scripts/expand-beverages-sauces.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/expand-beverages-sauces.py .github/workflows/expand-beverages-sauces.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Expand tea beverages zero sauces and alternatives"
          git push
