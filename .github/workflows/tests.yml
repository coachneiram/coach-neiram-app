# Lance la suite de tests a chaque envoi de code.
#
# Sans risque : ce workflow ne deploie rien et ne touche pas au site. Il
# signale simplement, par une croix rouge sur le commit, qu'une modification
# a casse quelque chose — avant que les clients ne s'en apercoivent.

name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Application et proxy
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Une seule dependance, et pour une seule raison : tests/appareil.test.mjs
      # verifie le choix de l'appareil emule, et lit pour cela la TABLE des
      # appareils de Playwright — de simples donnees. Aucun navigateur n'est
      # telecharge ici : playwright-core ne contient que du code et des donnees.
      # Les navigateurs restent l'affaire de la chaine
      # Navigateur.
      #
      # Sans cette ligne, le fichier de test ne se charge pas du tout : ce
      # n'est pas un test qui echoue, ce sont seize tests qui disparaissent
      # du compte sans que rien ne le dise.
      - name: Installer la table des appareils (sans navigateur)
        run: npm i --no-save playwright-core@1.63.0

      # node --test peut afficher « not ok » sur un bloc describe qui plante
      # au chargement (fichier absent, import casse) et terminer quand meme
      # avec le code 0 et « fail 0 » : des tests cessent de tourner sans
      # que la chaine ne devienne rouge. On echoue donc aussi sur la sortie.
      - name: Tests de l'application
        run: |
          SORTIE=$(mktemp); set +e
          node --test tests/*.test.mjs > "$SORTIE" 2>&1; CODE=$?
          set -e
          grep -E "^# (tests|pass|fail)" "$SORTIE"
          if [ "$CODE" -ne 0 ] || grep -qE "^\s*not ok" "$SORTIE"; then
            grep -E "^\s*not ok" "$SORTIE" || tail -50 "$SORTIE"
            exit 1
          fi

      - name: Tests du proxy Cloudflare
        run: node worker/test-worker.mjs
