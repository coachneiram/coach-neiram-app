name: Improve food search

on:
  push:
    branches: [main]
    paths:
      - 'scripts/improve-food-search.py'

permissions:
  contents: write

jobs:
  patch-food-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply food search improvements
        run: python scripts/improve-food-search.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/improve-food-search.py .github/workflows/improve-food-search.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Improve raw food search and coffee ingredients"
          git push
