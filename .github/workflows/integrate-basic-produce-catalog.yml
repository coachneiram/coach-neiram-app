name: Integrate basic produce catalog

on:
  push:
    branches: [main]

jobs:
  integrate:
    if: ${{ github.event.head_commit.message != 'Integrate basic produce catalog into app' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject catalog before app code
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="food-basic-catalog.js"></script>'
          if tag not in s:
              marker = '<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>'
              if marker not in s:
                  raise SystemExit('ReactDOM marker not found; refusing to patch')
              s = s.replace(marker, marker + '\n' + tag, 1)
              p.write_text(s, encoding='utf-8')
          print('catalog integrated:', tag in s)
          PY
      - name: Validate HTML script structure
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert '<script src="food-basic-catalog.js"></script>' in s
          assert s.count('<script src="food-basic-catalog.js"></script>') == 1
          print('integration validation passed')
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Integrate basic produce catalog into app"
          git push
