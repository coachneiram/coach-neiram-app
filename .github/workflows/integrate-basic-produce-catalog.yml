name: Integrate food catalogs

on:
  push:
    branches: [main]

jobs:
  integrate:
    if: ${{ github.event.head_commit.message != 'Integrate food catalogs into app' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject food catalogs before app code
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>'
          tags = [
              '<script src="food-basic-catalog.js"></script>',
              '<script src="food-extended-catalog.js"></script>',
          ]
          if marker not in s:
              raise SystemExit('ReactDOM marker not found; refusing to patch')
          insertion = marker
          for tag in tags:
              if tag not in s:
                  insertion += '\n' + tag
          if insertion != marker:
              s = s.replace(marker, insertion, 1)
              p.write_text(s, encoding='utf-8')
          print('food catalogs integrated')
          PY
      - name: Validate HTML script structure
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          for tag in ('<script src="food-basic-catalog.js"></script>', '<script src="food-extended-catalog.js"></script>'):
              assert tag in s, tag
              assert s.count(tag) == 1, tag
          print('food catalog integration validation passed')
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Integrate food catalogs into app"
          git push
